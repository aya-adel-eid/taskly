<!-- Desktop Skeleton -->
<div class="hidden lg:block bg-white rounded-xl shadow-2xs overflow-hidden">
  <div class="grid grid-cols-[2fr_1fr_60px] bg-[#E0E8FF4D] px-6 py-3">
    <div class="h-4 w-20 bg-gray-200 rounded animate-pulse"></div>
    <div class="h-4 w-16 bg-gray-200 rounded animate-pulse"></div>
    <div class="h-4 w-12 bg-gray-200 rounded animate-pulse justify-self-center"></div>
  </div>

  @for (item of [1, 2, 3]; track $index) {
    <div class="grid grid-cols-[2fr_1fr_60px] items-center px-6 py-4 border-b border-[#E8EDFF]">
      <!-- Member Skeleton -->
      <div class="flex items-center gap-4">
        <div class="size-12 rounded-xl bg-gray-200 animate-pulse shrink-0"></div>
        <div class="space-y-2">
          <div class="h-4 w-32 bg-gray-200 rounded animate-pulse"></div>
          <div class="h-3 w-48 bg-gray-200 rounded animate-pulse"></div>
        </div>
      </div>

      <!-- Role Skeleton -->
      <div>
        <div class="h-6 w-16 bg-gray-200 rounded-full animate-pulse"></div>
      </div>

      <!-- Action Skeleton -->
      <div class="flex justify-center">
        <div class="size-8 rounded-md bg-gray-200 animate-pulse"></div>
      </div>
    </div>
  }
</div>

<!-- Mobile Skeleton -->
<div class="lg:hidden space-y-3">
  @for (item of [1, 2, 3]; track $index) {
    <div class="bg-white rounded-xl p-4 shadow-xs">
      <div class="flex justify-between items-center">
        <div class="flex gap-3">
          <div class="size-12 rounded-xl bg-gray-200 animate-pulse shrink-0"></div>
          <div class="space-y-2">
            <div class="h-4 w-28 bg-gray-200 rounded animate-pulse"></div>
            <div class="h-3 w-40 bg-gray-200 rounded animate-pulse"></div>
          </div>
        </div>

        <div class="flex flex-col items-end gap-3">
          <div class="h-6 w-16 bg-gray-200 rounded-full animate-pulse"></div>
          <div class="size-6 bg-gray-200 rounded animate-pulse"></div>
        </div>
      </div>
    </div>
  }
</div>
