<div class="fixed inset-0 bg-[#041B3C66]/40 flex items-end md:items-center md:justify-center z-50">
  <div class="bg-white rounded-t-4xl lg:rounded-lg w-full lg:w-md">
    <!-- header moblie -->
    <div class="lg:hidden px-8">
      <div class="w-12 h-1.5 bg-[#C3C6D64D] relative mt-[32px] ms-[171px] rounded-xl"></div>
      <div class="flex flex-col justify-between mt-[70px]">
        <div class="flex justify-between">
          <span
            class="block lg:hidden text-[11px] leading-[16.5px] tracking-[0.55px] font-bold text-[#003D9B]"
            >PROJECT NAME</span
          >
          <button (click)="close()" class="cursor-pointer">
            <svg
              width="14"
              height="14"
              viewBox="0 0 14 14"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M1.4 14L0 12.6L5.6 7L0 1.4L1.4 0L7 5.6L12.6 0L14 1.4L8.4 7L14 12.6L12.6 14L7 8.4L1.4 14Z"
                fill="#434654"
              />
            </svg>
          </button>
        </div>
        <h2 class="font-bold text-2xl leading-8 tracking-[-0.6px] text-[#041B3C]">
          Invite Team Member
        </h2>
      </div>
      <p class="text-sm leading-5 tracking-normal text-[#4F5F7B]">
        Send an invitation to join the Architectural Studio workspace.
      </p>
    </div>
    <!-- header Desctope -->
    <div class="px-8 pt-8 lg:flex flex-col gap-2 hidden">
      <div class="flex justify-between items-center">
        <span class="size-12 rounded-lg bg-[#F1F3FF] lg:flex items-center justify-center hidden">
          <svg
            width="22"
            height="16"
            viewBox="0 0 22 16"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M17 10V7H14V5H17V2H19V5H22V7H19V10H17ZM8 8C6.9 8 5.95833 7.60833 5.175 6.825C4.39167 6.04167 4 5.1 4 4C4 2.9 4.39167 1.95833 5.175 1.175C5.95833 0.391667 6.9 0 8 0C9.1 0 10.0417 0.391667 10.825 1.175C11.6083 1.95833 12 2.9 12 4C12 5.1 11.6083 6.04167 10.825 6.825C10.0417 7.60833 9.1 8 8 8ZM0 16V13.2C0 12.6333 0.145833 12.1125 0.4375 11.6375C0.729167 11.1625 1.11667 10.8 1.6 10.55C2.63333 10.0333 3.68333 9.64583 4.75 9.3875C5.81667 9.12917 6.9 9 8 9C9.1 9 10.1833 9.12917 11.25 9.3875C12.3167 9.64583 13.3667 10.0333 14.4 10.55C14.8833 10.8 15.2708 11.1625 15.5625 11.6375C15.8542 12.1125 16 12.6333 16 13.2V16H0Z"
              fill="#003D9B"
            />
          </svg>
        </span>

        <button (click)="close()" class="cursor-pointer">
          <svg
            width="14"
            height="14"
            viewBox="0 0 14 14"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M1.4 14L0 12.6L5.6 7L0 1.4L1.4 0L7 5.6L12.6 0L14 1.4L8.4 7L14 12.6L12.6 14L7 8.4L1.4 14Z"
              fill="#737685"
            />
          </svg>
        </button>
      </div>

      <!-- title -->
      <h2 class="font-bold text-2xl leading-8 tracking-[-0.6px] text-[#041B3C] hidden lg:block">
        Invite Team Member
      </h2>
      <p class="text-sm leading-5 tracking-normal text-[#4F5F7B]">
        Send an invitation to join the Architectural Studio workspace.
      </p>
    </div>
    <!-- input email -->
    <div class="px-8 pt-6 pb-8 gap-6 flex flex-col">
      <div>
        <label class="label-input">Email Address</label>
        <div class="relative">
          <input
            type="email"
            class="input-control text-[16px] leading-[100%] tracking-normal text-[#73768599] w-full"
            placeholder="Enter email address"
          />
          <span class="absolute top-1/2 inset-e-4 -translate-y-1/2">
            <svg
              width="15"
              height="48"
              viewBox="0 0 15 48"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M1.5 30C1.0875 30 0.734375 29.8531 0.440625 29.5594C0.146875 29.2656 0 28.9125 0 28.5V19.5C0 19.0875 0.146875 18.7344 0.440625 18.4406C0.734375 18.1469 1.0875 18 1.5 18H13.5C13.9125 18 14.2656 18.1469 14.5594 18.4406C14.8531 18.7344 15 19.0875 15 19.5V28.5C15 28.9125 14.8531 29.2656 14.5594 29.5594C14.2656 29.8531 13.9125 30 13.5 30H1.5ZM7.5 24.75L1.5 21V28.5H13.5V21L7.5 24.75ZM7.5 23.25L13.5 19.5H1.5L7.5 23.25ZM1.5 21V19.5V21V28.5V21Z"
                fill="#737685"
              />
            </svg>
          </span>
        </div>
      </div>
    </div>
    <!-- actions -->
    <div class="flex flex-col lg:flex-row px-8 pb-8 pt-2 gap-3">
      <button
        class="order-2 lg:order-1 pb-[14.5px] pt-[13.5px] rounded-[2px] text-[#4F5F7B] h-5 font-semibold text-sm leading-5 tracking-normal w-full"
      >
        Cancel
      </button>
      <button
        class="order-1 lg:order-2 btn-Primary bg-linear-to-r from-primary to-primary-container flex justify-center items-center w-full lg:rounded-xs rounded-lg"
      >
        Send Invitation
      </button>
    </div>
  </div>
</div>
