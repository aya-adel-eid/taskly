<div
  class="relative rounded-lg p-4 cursor-pointer transition border border-[#C3C6D61A]/10 shadow-[0px_2px_8px_0px_rgba(0,0,0,0.02)]"
  [class.border-l-4]="task()?.status === 'IN_PROGRESS'"
  [class.border-l-[#0052CC]]="task()?.status === 'IN_PROGRESS'"
  [class.bg-[#FFDAD633]]="task()?.status === 'BLOCKED'"
  [class.border-[#BA1A1A1A]]="task()?.status === 'BLOCKED'"
  [class.bg-white]="task()?.status !== 'BLOCKED'"
  (click)="getTaskDetails(task()?.project_id!, task()?.id!)"
>
  <h2 class="text-sm font-medium text-[#041B3C] leading-[19.25px] line-clamp-2 tracking-normal">
    {{ task()?.title }}
  </h2>

  <div class="flex items-center justify-between mt-3">
    <div
      class="flex items-center gap-1 text-[#94A3B8] text-[10px] font-bold leading-3.75 tracking-normal"
      [class]="task()?.status === 'IN_PROGRESS' ? 'text-primary' : 'text-[#94A3B8]'"
    >
      @if (isDelayed) {
        <div class="flex items-center gap-1 text-[#E0433C] text-[11px] font-medium">
          <span>
            <svg
              width="11"
              height="10"
              viewBox="0 0 11 10"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M0 9.5L5.5 0L11 9.5H0ZM1.725 8.5H9.275L5.5 2L1.725 8.5ZM5.5 8C5.64167 8 5.76042 7.95208 5.85625 7.85625C5.95208 7.76042 6 7.64167 6 7.5C6 7.35833 5.95208 7.23958 5.85625 7.14375C5.76042 7.04792 5.64167 7 5.5 7C5.35833 7 5.23958 7.04792 5.14375 7.14375C5.04792 7.23958 5 7.35833 5 7.5C5 7.64167 5.04792 7.76042 5.14375 7.85625C5.23958 7.95208 5.35833 8 5.5 8ZM5 6.5H6V4H5V6.5Z"
                fill="#BA1A1A"
              />
            </svg>
          </span>
          <span class="font-bold text-[10px] leading-[15px] tracking-normal text-[#BA1A1A] block">
            DELAYED
          </span>
        </div>
      } @else if (isToday) {
        <div class="flex items-center gap-1 text-[#2F6FED] text-[11px] font-bold">
          <svg
            width="9"
            height="10"
            viewBox="0 0 9 10"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M1 10C0.725 10 0.489583 9.90208 0.29375 9.70625C0.0979166 9.51042 0 9.275 0 9V2C0 1.725 0.0979166 1.48958 0.29375 1.29375C0.489583 1.09792 0.725 1 1 1H1.5V0H2.5V1H6.5V0H7.5V1H8C8.275 1 8.51042 1.09792 8.70625 1.29375C8.90208 1.48958 9 1.725 9 2V9C9 9.275 8.90208 9.51042 8.70625 9.70625C8.51042 9.90208 8.275 10 8 10H1ZM1 9H8V4H1V9ZM1 3H8V2H1V3ZM1 3V2V3Z"
              fill="#003D9B"
            />
          </svg>
          <span class="font-bold text-[10px] tracking-normal leading-[15px] text-[#003D9B]">
            TODAY
          </span>
        </div>
      } @else if (task()?.due_date) {
        <div class="flex items-center gap-1 text-[#737685] text-[11px]">
          <svg
            width="10"
            height="10"
            viewBox="0 0 10 10"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect x="0.5" y="1.5" width="9" height="8" rx="1" stroke="#737685" />
            <path d="M0.5 3.5H9.5" stroke="#737685" />
            <path d="M2.5 0.5V2.5M7.5 0.5V2.5" stroke="#737685" stroke-linecap="round" />
          </svg>
          {{ task()?.due_date | date: 'MMM d' | uppercase }}
        </div>
      } @else {
        <span></span>
      }
    </div>

    <div
      class="w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-semibold shrink-0"
      [class]="
        task()?.status === 'IN_PROGRESS' ? 'bg-[#0052CC] text-white' : 'bg-[#E0E8FF] text-[#041B3C]'
      "
    >
      @if (task()?.assignee?.name) {
        {{ sharedService.getInitials(task()?.assignee?.name!) }}
      } @else {
        <svg
          width="12"
          height="12"
          viewBox="0 0 12 12"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M10.7333 11.5646L9.20208 10.0333H1.53125V8.4C1.53125 8.06944 1.61632 7.76562 1.78646 7.48854C1.9566 7.21146 2.18264 7 2.46458 6.85417C2.90208 6.63056 3.34687 6.45069 3.79896 6.31458C4.25104 6.17847 4.71042 6.07639 5.17708 6.00833L0 0.83125L0.83125 0L11.5646 10.7333L10.7333 11.5646ZM2.69792 8.86667H8.03542L6.28542 7.11667C6.26597 7.11667 6.25139 7.11667 6.24167 7.11667C6.23194 7.11667 6.21736 7.11667 6.19792 7.11667C5.65347 7.11667 5.11389 7.18229 4.57917 7.31354C4.04444 7.44479 3.51458 7.64167 2.98958 7.90417C2.90208 7.95278 2.8316 8.02083 2.77813 8.10833C2.72465 8.19583 2.69792 8.29306 2.69792 8.4V8.86667ZM9.93125 6.85417C10.2132 6.99028 10.4368 7.19688 10.6021 7.47396C10.7674 7.75104 10.8549 8.05 10.8646 8.37083L8.91042 6.41667C9.08542 6.48472 9.25799 6.55278 9.42813 6.62083C9.59826 6.68889 9.76597 6.76667 9.93125 6.85417ZM7.48125 4.9875L6.62083 4.12708C6.84444 4.03958 7.02431 3.89618 7.16042 3.69688C7.29653 3.49757 7.36458 3.27639 7.36458 3.03333C7.36458 2.7125 7.25035 2.43785 7.02187 2.20937C6.7934 1.9809 6.51875 1.86667 6.19792 1.86667C5.95486 1.86667 5.73368 1.93472 5.53438 2.07083C5.33507 2.20694 5.19167 2.38681 5.10417 2.61042L4.24375 1.75C4.46736 1.41944 4.74931 1.16181 5.08958 0.977083C5.42986 0.792361 5.79931 0.7 6.19792 0.7C6.83958 0.7 7.38889 0.928472 7.84583 1.38542C8.30278 1.84236 8.53125 2.39167 8.53125 3.03333C8.53125 3.43194 8.43889 3.80139 8.25417 4.14167C8.06944 4.48194 7.81181 4.76389 7.48125 4.9875ZM8.03542 8.86667H2.69792C2.69792 8.86667 2.72465 8.86667 2.77813 8.86667C2.8316 8.86667 2.90208 8.86667 2.98958 8.86667C3.25208 8.86667 3.52431 8.86667 3.80625 8.86667C4.08819 8.86667 4.42118 8.86667 4.80521 8.86667C5.18924 8.86667 5.64132 8.86667 6.16146 8.86667C6.6816 8.86667 7.30625 8.86667 8.03542 8.86667Z"
            fill="#4F5F7B"
          />
        </svg>
      }
    </div>
  </div>
</div>
